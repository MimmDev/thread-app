services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thread
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "3010:3010"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/thread
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
